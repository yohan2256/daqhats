; =====================================================================
;  MCC 172 Noise Monitor configuration
; =====================================================================
;  Edit this file on the Raspberry Pi, then restart the service:
;      sudo systemctl restart noise-monitor
; ---------------------------------------------------------------------

[acquisition]
; Channels to scan (0, 1, or both). Comma separated.
channels = 0, 1

; Samples per second per channel.
; The MCC 172 generates 51200 / N (N = 1..256), so the value is rounded
; to the nearest achievable rate. Common choices: 51200, 25600, 10240.
sample_rate = 51200

; IEPE constant-current (2 mA) supply for the connected sensor.
; true  -> ON  (use with IEPE microphones / accelerometers)
; false -> OFF (use only with self-powered / AC-coupled sources)
iepe_enable = true

; Send the full-rate raw waveform on the stream port. Set to false to send
; ONLY the fractional-octave band output below (saves ~6.4 Mbit/s of raw).
stream_raw = true

[calibration]
; Sensor sensitivity in mV per mechanical unit, applied per channel BEFORE
; the data is streamed. See a_in_sensitivity_write() in the daqhats docs.
;
;   * Leave at 1000 for NO scaling -> streamed data is in volts (V).
;   * For a microphone rated 50 mV/Pa, set the value to 50
;     -> streamed data is in pascals (Pa) and SPL can be computed as
;        20 * log10(Prms / 20e-6).
;
; Fill these in once you know your microphone's calibrated sensitivity.
sensitivity_ch0 = 1000
sensitivity_ch1 = 1000

[network]
; Interface to bind the TCP servers to. 0.0.0.0 listens on all interfaces
; (Wi-Fi, USB-ethernet, etc.). The laptop connects to the Pi's IP address.
host = 0.0.0.0

; Two separate ports:
;   control_port - newline-delimited JSON commands/responses (both ways)
;   stream_port  - raw waveform frames (Pi -> laptop)
control_port = 5000
stream_port = 5001

; Per-client send buffer, in blocks. If a laptop cannot keep up, the
; oldest queued blocks are dropped (so a slow client never stalls the ADC).
max_queue_blocks = 64

[control]
; Begin streaming automatically at boot (original headless behavior). The
; laptop can always stop/reconfigure/restart afterwards over the control
; channel. Set to false to boot idle and start only on command.
autostart = true

[bands]
; Optional fractional-octave (1/3-octave by default) band output. Each band
; is a Butterworth band-pass filter applied in real time, then DECIMATED to
; just above twice its upper edge, and sent as BAND frames on the stream
; port. The laptop applies time-weighting (Fast/Slow/Impulse), Leq, etc.
; Requires numpy + scipy on the Pi (sudo apt install python3-numpy python3-scipy).
;
; BANDWIDTH: high 1/3-octave bands are wide, so they barely decimate. The
; full 20 Hz - 20 kHz set at 51.2 kHz is ~5x the raw stream for 2 channels
; (~36 Mbit/s), which is marginal on Wi-Fi. The top bands dominate, so
; lowering f_max is the most effective way to fit a link (e.g. f_max = 5000
; cuts it dramatically); using one channel or set stream_raw = false also help.
enabled = false

; Band-center frequency range (Hz) and octave fraction (3 = 1/3-octave).
f_min = 20
f_max = 20000
fraction = 3

; Butterworth order passed to scipy.signal.butter. A band-pass design yields
; a 2*order system, so order = 6 is a 12th-order band-pass (6 biquads);
; use order = 3 for a literal 6th-order band-pass.
order = 6

; Keep each band's decimated rate >= 2 * upper_edge * margin (>= 1.0).
decimation_margin = 1.0
